
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2, #6dd5ed);
    background-size: 300% 300%;
    animation: gradient 8s ease infinite;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.login-box {
    width: min(100%, 380px);
    padding: clamp(25px, 6vw, 40px);
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: slideUp 1s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(60px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    text-align: center;
    color: white;
    font-size: clamp(24px, 5vw, 31px);
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #eee;
    font-size: clamp(13px, 2.5vw, 15px);
    margin-bottom: 30px;
}

label {
    display: block;
    color: white;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 22px;
    border: 2px solid transparent;
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.9);
    font-size: 15px;
    transition: 0.3s;
}

input:focus {
    border-color: #ffd700;
    box-shadow: 0 0 12px rgba(255,215,0,0.5);
    transform: scale(1.02);
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff8a00, #ff3d77);
    color: white;
    font-size: clamp(15px, 2.5vw, 17px);
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(255,61,119,0.4);
}

button:active {
    transform: scale(0.96);
}

.error {
    color: white;
    background: rgba(255,0,0,0.3);
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 20px;
    animation: shake 0.4s;
    font-size: 14px;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

.footer {
    color: white;
    text-align: center;
    margin-top: 25px;
    font-size: clamp(11px, 2vw, 13px);
}

@media (max-width: 400px) {
    .login-box { padding: 25px 20px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <h2>🎓 Student Login</h2>

    <p class="subtitle">
        Welcome back! Please login.
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter Username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Login →
        </button>
    </form>

    <div class="footer">
        © 2026 Student Portal | All Rights Reserved
    </div>

</div>

</body>
</html>
