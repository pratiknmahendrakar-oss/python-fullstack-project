
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2, #6dd5ed);
            background-size: 300% 300%;
            animation: gradient 8s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dashboard {
            width: min(100%, 500px);
            padding: clamp(30px, 6vw, 50px) 25px;
            text-align: center;
            background: rgba(255,255,255,0.17);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            color: white;
            font-size: clamp(25px, 5vw, 35px);
            margin-bottom: 15px;
        }

        h2 {
            color: #ffe082;
            font-size: clamp(22px, 5vw, 29px);
            margin-bottom: 18px;
            overflow-wrap: anywhere;
        }

        p {
            color: white;
            font-size: clamp(14px, 2.5vw, 17px);
            line-height: 1.7;
            margin-bottom: 30px;
        }

        button {
            padding: 13px 35px;
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(221,36,118,0.4);
        }

        .footer {
            margin-top: 30px;
            color: rgba(255,255,255,0.8);
            font-size: clamp(11px, 2vw, 13px);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="icon">🎓</div>

        <h1>Welcome!</h1>

        <h2>{{ user.username }}</h2>

        <p>
            You have successfully logged into your
            Student Dashboard.
            <br>
            We are happy to have you here!
        </p>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout ↗</button>
        </form>

        <div class="footer">
            © 2026 Student Portal | Have a great day!
        </div>

    </div>

</body>
</html>
